[project]
name = "sovereign-sdk-workspace"
version = "1.3.0"
description = "Monorepo workspace for Sovereign System components"
requires-python = ">=3.12"
authors = [
    { name = "kenwalger", email = "kenalger@comcast.net" }
]


[tool.uv.workspace]
members = ["packages/*"]

[tool.uv]
dev-dependencies = [
    "pytest>=8.0.0",
    "pytest-asyncio>=1.0.0",
    "fastapi>=0.100.0",
    "httpx>=0.24.0",
    "sovereign-sdk-core",
    "sovereign-sdk-edge",
    "sovereign-sdk-fastapi",
    "sovereign-sdk-ledger",
    "sovereign-sdk-runtime",
    "sovereign-sdk-sensor",
    "sovereign-sdk-sieve",
    "sovereign-sdk-airlock",
]

# This block tells uv to resolve these dev-dependencies locally
[tool.uv.sources]
sovereign-sdk-airlock = { workspace = true }
sovereign-sdk-core = { workspace = true }
sovereign-sdk-edge = { workspace = true }
sovereign-sdk-fastapi = { workspace = true }
sovereign-sdk-ledger = { workspace = true }
sovereign-sdk-runtime = { workspace = true }
sovereign-sdk-sensor = { workspace = true }
sovereign-sdk-sieve = { workspace = true }

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["packages"]
addopts = "--import-mode=importlib"
