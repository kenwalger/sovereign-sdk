[build-system]
requires = ["setuptools>=77.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sovereign-sdk-edge"
version = "1.3.0"
description = "Middleware pipeline bridging sovereign-sensor raw intake and sovereign-ledger immutable storage via sovereign-sieve payload transformation"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "sovereign-sdk-core>=1.3.0",
    "sovereign-sdk-ledger>=1.3.0",
    "sovereign-sdk-sieve>=1.3.0",
]
classifiers = [
    "Programming Language :: Python :: 3.12",
    "Intended Audience :: Developers",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries",
]

[project.urls]
Homepage = "https://github.com/kenwalger/sovereign-sdk"
Repository = "https://github.com/kenwalger/sovereign-sdk"
Changelog = "https://github.com/kenwalger/sovereign-sdk/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
    "sovereign-sdk-sensor>=1.3.0",
]

[tool.setuptools.packages.find]
where = ["src"]
